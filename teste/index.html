<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificação</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e1e2f 0%, #10101b 100%);
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            font-weight: 600;
            color: #e2e2e2;
        }

        .btn-notify {
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 117, 252, 0.4);
            outline: none;
        }

        .btn-notify:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 117, 252, 0.6);
        }

        .btn-notify:active {
            transform: translateY(1px);
        }

        /* Toast Container */
        #toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }

        /* Toast Notification */
        .toast {
            background: rgba(30, 41, 59, 0.9);
            color: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border-left: 4px solid #2575fc;
            animation: slideIn 0.3s ease forwards, fadeOut 0.3s ease 2.7s forwards;
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateX(100%);
        }

        .toast-icon {
            font-size: 1.2rem;
            color: #2575fc;
        }

        .toast-content {
            display: flex;
            flex-direction: column;
        }

        .toast-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .toast-message {
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(10%);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sistema de Notificação</h1>
        <button class="btn-notify" onclick="showNotification()">Mostrar Notificação</button>
    </div>

    <div id="toast-container"></div>

    <script>
        function showNotification() {
            const container = document.getElementById('toast-container');
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            toast.innerHTML = `
                <div class="toast-icon">✨</div>
                <div class="toast-content">
                    <span class="toast-title">Sucesso!</span>
                    <span class="toast-message">Nova notificação gerada.</span>
                </div>
            `;
            
            container.appendChild(toast);
            
            // Remove the toast after animation completes (3 seconds)
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
